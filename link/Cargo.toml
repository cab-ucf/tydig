[package]
name = "tydig-link"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.91"
publish = false

[dependencies]
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
