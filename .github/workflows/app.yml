# The app (app/), unsigned, for each desktop: a tag app-vX.Y.Z, or by hand.
# Its bundles are the run's artifacts. Phones: see README, App.
name: app
on:
  push: { tags: ['app-v*'] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix: { on: [ubuntu-22.04, macos-latest, windows-latest] }
    runs-on: ${{ matrix.on }}
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
          libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tydig-${{ matrix.on }}
          path: |
            app/target/release/bundle/*/*.AppImage
            app/target/release/bundle/*/*.deb
            app/target/release/bundle/*/*.rpm
            app/target/release/bundle/*/*.dmg
            app/target/release/bundle/*/*.msi
            app/target/release/bundle/*/*-setup.exe
