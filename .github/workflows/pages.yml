# The static site: the editor (opens <site>/#<hub id>, else TYDIG_HUB),
# app/ for older links, the landing page at about/.
# Variables: TYDIG_HUB (`just` prints it after the #), TYDIG_BRAND.
name: pages
on: { push: { branches: [main] }, workflow_dispatch: }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: { VITE_HUB: '${{ vars.TYDIG_HUB }}', TYDIG_BRAND: '${{ vars.TYDIG_BRAND }}' }
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci -w client && npm run build
      - run: cp -r client/dist _site && cp -r client/dist _site/app && cp .nojekyll _site && mkdir _site/about && cp index.html _site/about
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
