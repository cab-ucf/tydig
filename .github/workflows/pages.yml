# The static site: the landing page, and the editor at app/ that collaborators
# open with a hub's link (<site>/app/#<seed>; see server/link.mjs).
# Settings > Pages > Source: GitHub Actions.
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci -w client && npm run build
      - run: mkdir _site && cp index.html .nojekyll _site/ && cp -r client/dist _site/app
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
