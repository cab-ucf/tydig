<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- for the static site, which sends no CSP header (a hub does) -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'" />
  <title>tydig</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="@brand/brand.css" />
</head>
<body>
  <header id="bar">
    <span id="brand"></span>
    <nav id="menubar">
      <div class="menu"><button>File</button><div class="dropdown">
        <button data-act="quick-open">Open file<kbd>Mod-P</kbd></button>
        <button data-act="new-file">New file</button>
        <button data-act="upload">Upload files or an archive</button>
        <button data-act="projects">Projects</button>
        <hr/>
        <button data-act="save">Save: commit, sign, push<kbd>Mod-S</kbd></button>
        <button data-act="checkpoint">Save with a name</button>
        <button data-act="export-pdf">Export PDF</button>
        <button data-act="export-docx">Export Word, citations for EndNote</button>
        <button data-act="download-src">Download sources (.tar.gz)</button>
        <button data-act="download-all">Download everything (.tar.gz)</button>
      </div></div>
      <div class="menu"><button>Edit</button><div class="dropdown">
        <button data-act="undo">Undo<kbd>Mod-Z</kbd></button>
        <button data-act="redo">Redo<kbd>Mod-Shift-Z</kbd></button>
        <hr/>
        <button data-act="comment">Comment on the selection<kbd>Mod-Alt-M</kbd></button>
        <button data-act="cite">Cite: find papers, check references</button>
        <button data-act="spelling">Check spelling, every file</button>
      </div></div>
      <div class="menu"><button>View</button><div class="dropdown">
        <button data-act="comments">Comments</button>
        <button data-act="chat">Discussion</button>
        <button data-act="history">History</button>
        <button data-act="build">Build</button>
        <button data-act="checklist">Grant checklist</button>
        <button data-act="review">Changes made while away</button>
        <hr/>
        <button data-act="toggle-tree" data-check="treeOpen">File tree</button>
        <button data-act="toggle-side" data-check="sideOpen">Side panel</button>
        <button data-act="max-editor">Editor only</button>
        <button data-act="max-preview">Preview only</button>
        <button data-act="focus" data-check="focus">Focus: the text alone<kbd>Esc leaves</kbd></button>
        <button data-act="fullscreen">Full screen</button>
        <button data-act="theme">Theme: dark, cyberpunk, light</button>
      </div></div>
      <div class="menu"><button>Settings</button><div class="dropdown">
        <button data-act="share">Share project</button>
        <button data-act="gitremote">Git remote (durable copy)</button>
        <button data-act="template">Project template</button>
        <hr/>
        <button data-act="spell" data-check="spell">Spelling and grammar</button>
        <button data-act="ghost" data-check="ghost">Ghost suggestions</button>
        <button data-act="scope" data-check="scope">Surprise overlay</button>
        <button data-act="scope-bits" data-check="scope-bits">&emsp;by surprise</button>
        <button data-act="scope-ent" data-check="scope-ent">&emsp;by flatness</button>
        <button data-act="scope-ai" data-check="scope-ai">&emsp;by AI-likeness</button>
        <button data-act="lsp" data-check="lsp">Completions (tinymist)</button>
        <button data-act="vim" data-check="vim">Vim keys</button>
        <hr/>
        <button data-act="password">Change password</button>
        <button data-act="delete-account">Delete my account</button>
        <button data-act="signout">Sign out</button>
      </div></div>
      <div class="menu"><button>Help</button><div class="dropdown">
        <button data-act="palette">Find a command<kbd>Mod-K</kbd></button>
        <button data-act="shortcuts">Shortcuts</button>
        <a href="docs/" target="_blank" rel="noopener">tydig docs</a>
        <a href="https://typst.app/docs/" target="_blank" rel="noopener">Typst docs</a>
      </div></div>
    </nav>
    <span id="projname"></span>
    <span id="peers" title="who is here"></span>
    <span class="spacer"></span>
    <label id="main-label">compile <select id="main-sel"></select></label>
    <button id="bar-comment" data-act="comment" title="Comment on the selected text (Mod-Alt-M)">comment</button>
    <button id="bar-cite" data-act="cite" title="Find papers for the selection; check references">cite</button>
    <button id="bar-build" data-act="build" title="Run the project's build (make)">build</button>
    <button id="bar-check" data-act="checklist" title="What the application needs, and what is here" hidden>checklist</button>
    <button id="bar-chat" data-act="discuss" title="Comments and the Discussion">discuss<b class="badge" hidden></b></button>
    <button id="bar-share" data-act="share" class="go" title="Invite people; the link they open">share</button>
    <span id="wordcount" title="words in this file"></span>
    <button id="scope" class="tgl" data-act="scope-next" hidden></button>
    <button id="bar-cmd" class="tgl" data-act="palette" title="Find any command">Mod-K</button>
    <span id="status" data-state="connecting">connecting</span>
  </header>
  <main id="layout">
    <nav id="tree-pane">
      <div class="sect">
        <div class="sect-head" data-sect="projectsOpen"><span class="tw">&#9662;</span> projects
          <button id="proj-new-btn" data-act="projects" title="New project">+</button></div>
        <div class="sect-body" id="projects-list"></div>
      </div>
      <div class="sect grow">
        <div class="sect-head" data-sect="filesOpen"><span class="tw">&#9662;</span> files
          <span><button id="new-file" data-act="new-file" title="New file (use / for directories)">+file</button>
          <button id="upload" data-act="upload" title="Upload binary (image, data)">up</button></span></div>
        <div class="sect-body" id="tree"></div>
      </div>
      <input id="upload-input" type="file" hidden multiple />
    </nav>
    <section id="editor"></section>
    <div id="split" title="drag to resize; double-click to even out"></div>
    <section id="preview">
      <div id="zoomctl">
        <button data-z="-">&minus;</button><button data-z="fit">fit</button><button data-z="+">+</button>
      </div>
      <div id="page"></div><pre id="diag" hidden></pre>
      <button id="pv-comment" hidden title="Comment on the selected text (Mod-Alt-M)">comment</button>
    </section>
    <aside id="side" hidden>
      <div id="side-head"><nav id="side-tabs"></nav><span id="side-title"></span>
        <button id="side-close" title="close the panel">&times;</button></div>
      <div id="side-body"></div>
    </aside>
  </main>
  <nav id="mtabs">
    <button data-m="files">Files</button><button data-m="edit" id="mt-edit">Edit</button>
    <button data-m="preview">Preview</button><button data-m="side">Discuss<b class="badge" hidden></b></button>
  </nav>
  <button id="focus-exit" data-act="focus" title="leave focus (Esc)">⤢ leave focus</button>
  <dialog id="qo"><input id="qo-input" /><div id="qo-list"></div></dialog>
  <dialog id="picker">
    <h3>Projects</h3>
    <div id="proj-list"></div>
    <form method="dialog" id="proj-new" class="row">
      <input id="proj-name" placeholder="new-project-name" pattern="[\w\-]{1,64}" required />
      <select id="proj-tpl" title="template"></select><select id="proj-brand" title="branding"></select>
      <button class="go">create</button>
      <button type="button" class="go" id="proj-zip"
        title="a new project from a .zip or .tar.gz (the name above, or the archive's)">from archive</button>
      <input type="file" id="proj-zip-input" accept=".zip,.tgz,.tar.gz,.tar" hidden />
    </form>
    <form method="dialog" id="proj-git" class="row">
      <input id="proj-git-url" placeholder="or a git URL to open a project stored on GitHub / GitLab / Codeberg" />
      <button class="go">open</button>
    </form>
    <form method="dialog" class="dlg-close"><button>close</button></form>
  </dialog>
  <dialog id="share">
    <h3>Share project</h3>
    <div id="share-body"></div>
    <form method="dialog" class="dlg-close"><button>close</button></form>
  </dialog>
  <dialog id="git">
    <h3>Git remote</h3>
    <div id="git-body"></div>
    <form method="dialog" class="dlg-close"><button>close</button></form>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
