[project]
name = "perplexiscope"
version = "1.1.0"
description = "How a language model reads a text: surprise, flatness and AI-likeness, served"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Chase Brown" }]
requires-python = ">=3.10"
dynamic = ["dependencies"]
scripts = { perplexiscope = "perplexiscope.serve:main" }

[tool.setuptools]
packages = ["perplexiscope"]
package-data = { perplexiscope = ["web/*", "calib/*.json"] }
dynamic = { dependencies = { file = "requirements.txt" } }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
