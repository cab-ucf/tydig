# A MIRA's R&R budget is not itemised: the request goes in Section F, the
# PD/PI at $0 in Section A, no other personnel, no subawards. One entry a year.
rates:
  fa: 0.52        # the institution's negotiated rate, entered in Section H
  fringe: 0       # (no personnel lines)
  raise: 0
personnel: []
other:            # category: equipment or dms get their own justification; fa: false keeps one out of the F&A base
  - { item: Requested direct costs (Section F), cost: [245000, 275000, 275000, 275000, 275000] }
  - { item: Confocal microscope stage incubator, cost: [25000, 0, 0, 0, 0], category: equipment, fa: false }
  - { item: Data deposition and curation, cost: [5000, 0, 0, 0, 0], category: dms }
