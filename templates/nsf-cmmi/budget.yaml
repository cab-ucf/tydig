# The budget's inputs; lib/budget.typ computes everything else from them
# (budget-report.typ shows it, budget.typ justifies it in Research.gov's
# lines, `make budget` gives it as Excel). One entry per year where a list is
# given; category: is the budget line (equipment, travel, participant,
# materials, publication, consultant, computing, subaward, other).
rates:
  fringe: 0.30    # of salary, unless a person sets their own
  fa: 0.50        # the institution's negotiated rate, on modified total direct costs
  raise: 0.03
personnel:        # base salary, calendar months of effort per year (senior: 2 at most)
  - { name: Ada Lovelace, salary: 115000, months: [1, 1, 1] }
  - { name: Charles Babbage, salary: 145000, months: [0.5, 0.5, 0.5] }
  - { name: "Graduate students, two (TBN)", salary: 60000, months: [12, 12, 12], fringe: 0.05 }
  - { name: Undergraduate researchers (TBN), salary: 12000, months: [12, 12, 12], fringe: 0 }
other:            # fa: false keeps one out of the F&A base
  - { item: Load frame fixtures and sensors, cost: [18000, 0, 0], category: equipment, fa: false }
  - { item: Printing feedstock and specimens, cost: [12000, 12000, 8000], category: materials }
  - { item: Conference travel, cost: [3000, 5000, 6000], category: travel }
  - { item: Open-access publication, cost: [0, 2500, 3000], category: publication }
  - { item: "Graduate tuition, two students", cost: [24000, 24000, 24000], category: other, fa: false }
