# Everything an EAGER (PAPPG II.F.3) needs, as Research.gov lists it. The
# editor's Checklist panel, the checklist page and `make full` read this.
#   file:  where it is (built here into out/, or uploaded into docs/); none = a form
#   from:  where to get an uploaded one;  when: always (default), applicable;
#   each: investigators = one per person;  before: sent ahead, not part of the proposal
# First the Concept Outline, by email; only with the program officer's
# approval may the proposal be submitted.
items:
  - { id: concept, name: "Concept Outline (emailed to the program officer first; not uploaded)", file: out/concept.pdf, limit: 2 pages, before: true }
  - { id: concurrence, name: Program Officer Concurrence Email, file: docs/po-concurrence.pdf, from: "the program officer's email approving the Concept Outline" }
  - { id: cover, name: "Cover Sheet (proposal type EAGER)", from: Research.gov }
  - { id: summary, name: Project Summary, file: out/summary.pdf, limit: 1 page }
  - { id: description, name: "Project Description (why EAGER, within it)", file: out/description.pdf, limit: 8 pages }
  - { id: references, name: References Cited, file: out/references.pdf }
  - { id: budgetform, name: Budget, from: "Research.gov: the numbers in out/budget-report.pdf" }
  - { id: budget, name: Budget Justification, file: out/budget.pdf, limit: 5 pages }
  - { id: facilities, name: "Facilities, Equipment and Other Resources", file: out/facilities.pdf }
  - id: biosketch
    name: Biographical Sketch (Common Form)
    each: investigators
    file: "docs/biosketch-{key}.pdf"
    from: https://www.ncbi.nlm.nih.gov/sciencv/
  - id: support
    name: Current and Pending (Other) Support (Common Form)
    each: investigators
    file: "docs/support-{key}.pdf"
    from: https://www.ncbi.nlm.nih.gov/sciencv/
  - id: synergistic
    name: Synergistic Activities
    each: investigators
    file: "docs/synergistic-{key}.pdf"
    limit: 1 page
  - id: coa
    name: Collaborators & Other Affiliations
    each: investigators
    file: "docs/coa-{key}.xlsx"
    from: https://www.nsf.gov/bfa/dias/policy/coa.jsp
  - { id: dmsp, name: "Data Management and Sharing Plan (all data behind a publication shared when it is published)", from: "the DMSP tool in Research.gov" }
  - { id: mentoring, name: Mentoring Plan, file: out/mentoring.pdf, limit: 1 page, when: applicable }
  - { id: letters, name: Letters of Collaboration, file: out/letters.pdf, when: applicable }
