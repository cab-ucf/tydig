# The hub (app), the only holder of podman's socket (sandbox), the build
# network's only way out (egress), and the surprise engine (scope, optional).
# TYDIG_DATA is absolute and mounted at itself: podman mounts projects by it.
name: tydig

x-locked: &locked
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges]
  restart: unless-stopped

services:
  app:
    <<: *locked
    build: { context: ., args: { TYDIG_BRAND: "${TYDIG_BRAND:-tydig}" } }
    image: localhost/tydig
    ports: ["${TYDIG_PORT:-8080}:3000"]
    env_file: .env
    environment:
      TYDIG_URL: ${TYDIG_URL:-http://localhost:8080}
      TYDIG_DATA: ${TYDIG_DATA}
      TYDIG_SANDBOX: sandbox:7000
      TYDIG_PERPLEXISCOPE: ${TYDIG_PERPLEXISCOPE:-}
    volumes: ["${TYDIG_DATA}:${TYDIG_DATA}:z"]
    networks: [default, ctl, assist]
    tmpfs: [/tmp]
    # level s0: the hub reads what builds write
    security_opt: [no-new-privileges, "label=level:s0"]

  sandbox:
    <<: *locked
    image: localhost/tydig
    command: [node, server/sandbox.mjs]
    environment:
      TYDIG_DATA: ${TYDIG_DATA}
      TYDIG_SANDBOX: 0.0.0.0:7000
      TYDIG_BUILD_NET: ${TYDIG_BUILD_NET:-1}
      TYDIG_IMAGE_NET: ${TYDIG_IMAGE_NET:-0}
      TYDIG_BUILD_CONTEXT: /app/buildctx
      # builds under gVisor (in the build image); none: plain containers
      TYDIG_RUNTIME: ${TYDIG_RUNTIME:-gvisor}
      CONTAINER_HOST: unix:///run/podman/podman.sock
    volumes:
      - ${TYDIG_DATA}:${TYDIG_DATA}:ro
      - ${TYDIG_PODMAN_SOCK}:/run/podman/podman.sock
    networks: [ctl]
    tmpfs: [/tmp]
    security_opt: [no-new-privileges, label=disable] # a host socket keeps its label
    healthcheck: { disable: true }

  egress:
    <<: *locked
    image: localhost/tydig
    command: [node, server/egress.mjs]
    networks: [default, build]
    healthcheck: { disable: true }

  scope:
    <<: *locked
    profiles: [scope]
    build:
      context: scope
      args:
        MODEL: ${TYDIG_SCOPE_MODEL:-Qwen/Qwen3-0.6B-Base}
        TORCH: ${TYDIG_TORCH:-cpu}
        DETECTOR: ${TYDIG_SCOPE_DETECTOR-meld}
    image: localhost/tydig-scope
    devices: ["${TYDIG_GPU:-/dev/null}"]
    networks: [assist]
    tmpfs: [/tmp]

networks:
  default: {}
  ctl: { internal: true }                     # hub <-> sandbox
  build: { internal: true, name: tydig-build } # builds <-> egress
  assist: { internal: true }                  # hub <-> scope
